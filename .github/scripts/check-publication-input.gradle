gradle.projectsEvaluated {
  rootProject.tasks.register('inspectPublicationInput') {
    doLast {
      def signer = rootProject.tasks.getByName('signPlugin')
      def publisher = rootProject.tasks.getByName('publishPlugin')
      def downloaded = rootProject.file('build/downloaded-release/intellij-biome-1.10.1.zip')
      if (signer.archiveFile.get().asFile != downloaded) {
        throw new GradleException('Signing does not consume the downloaded archive')
      }
      signer.didWork = false
      if (publisher.archiveFile.get().asFile != downloaded) {
        throw new GradleException('Unsigned publication does not consume the downloaded archive')
      }
      // Configure inert values without executing signing. A cached/up-to-date
      // signing task can have didWork=false and still requires its signed output.
      signer.privateKey.set('test-only-key')
      signer.certificateChain.set('test-only-chain')
      if (!signer.onlyIf.isSatisfiedBy(signer)) {
        throw new GradleException('Signing configuration control did not enable the native signing task')
      }
      if (publisher.archiveFile.get().asFile != signer.signedArchiveFile.get().asFile) {
        throw new GradleException('Configured signing must select signed output even when didWork is false')
      }
      signer.didWork = false
      println('PUBLICATION_INPUT_CHECKS_PASSED: downloaded input, unsigned upload, signed upload')
    }
  }
}
