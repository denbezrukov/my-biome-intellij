name: Publish

on:
  workflow_dispatch:
    inputs:
      nightly:
        type: boolean
        default: true
        required: false
        description: 'Build a nightly version'
      publish:
        type: boolean
        default: false
        required: false
        description: 'Publish the built archive to Marketplace and a GitHub draft'

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/_build.yaml
    with:
      nightly: ${{ inputs.nightly }}
      artifact: true

  publish-jetbrains:
    if: inputs.publish
    name: Publish to JetBrains Marketplace
    needs: [ build ]
    runs-on: ubuntu-24.04
    environment: intellij-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.2.0
        with:
          gradle-home-cache-cleanup: true

      - name: Download the artifact
        uses: actions/download-artifact@v4
        with:
          name: Biome-${{ needs.build.outputs.version }}.zip
          path: build/downloaded-release

      - name: Inspect downloaded archive
        id: inspect-archive
        run: |
          test -s "build/downloaded-release/intellij-biome-${{ needs.build.outputs.version }}.zip"
          unzip -t "build/downloaded-release/intellij-biome-${{ needs.build.outputs.version }}.zip"

      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin -PreleaseArchive="build/downloaded-release/intellij-biome-${{ needs.build.outputs.version }}.zip" -PpluginVersion="${{ needs.build.outputs.version }}"

  publish-github-release:
    if: inputs.publish
    name: Publish to GitHub Releases
    needs: [ build ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the artifact
        uses: actions/download-artifact@v4
        with:
          name: Biome-${{ needs.build.outputs.version }}.zip
          path: build/downloaded-release

      - name: Inspect downloaded archive
        id: inspect-archive
        run: |
          test -s "build/downloaded-release/intellij-biome-${{ needs.build.outputs.version }}.zip"
          unzip -t "build/downloaded-release/intellij-biome-${{ needs.build.outputs.version }}.zip"

      - name: Generate release notes
        id: release-notes
        uses: orhun/git-cliff-action@v2
        with:
          config: cliff.toml
          args: -vv --latest --strip header e71479100d4ed81b3e9c26881c38a0ddb7da31eb..
        env:
          OUTPUT: CHANGES.md

      - name: Strip tag from release notes
        run: tail -n +3 < CHANGES.md > RELEASE_NOTES.md

      - name: Publish extension to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          name: "v${{ needs.build.outputs.version }}"
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.build.outputs.nightly == 'true' }}
          draft: true
          files: build/downloaded-release/intellij-biome-${{ needs.build.outputs.version }}.zip
          tag_name: ${{ needs.build.outputs.nightly == 'true' && github.ref || format('v{0}', needs.build.outputs.version) }}
