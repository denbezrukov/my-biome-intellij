name: Integrate

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  plugin-tests:
    name: Plugin tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          npm install --global corepack@0.34.0
          corepack enable
          corepack prepare pnpm@10.5.2 --activate

      - name: Test required-results guard
        run: python3 .github/scripts/test-check-required-tests.py

      - name: Run plugin regression tests
        run: >-
          ./gradlew cleanTest test --no-build-cache
          --tests '*BiomeManualConfigSettingsTest'
          --tests '*BiomeManualConfigLspTest'
          --tests '*BiomeManualConfigV1LspTest'
          --tests '*BiomeManualConfigCliTest'
          --tests '*UnusedFunctionHighlightingTest'

      - name: Require executed regression tests
        if: always()
        run: python3 .github/scripts/check-required-tests.py build/test-results/test

      - name: Upload plugin test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-test-reports
          path: |
            build/test-results/test/
            build/reports/tests/test/

  build:
    name: Build
    uses: ./.github/workflows/_build.yaml
